<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPRIET Student & Faculty Portal Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            border-top: 5px solid #004085; /* Academic Blue accent */
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 85%;
            height: auto;
            object-fit: contain;
        }

        .portal-title {
            color: #333333;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #004085;
            box-shadow: 0 0 0 3px rgba(0, 64, 133, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            cursor: pointer;
        }

        .forgot-password {
            color: #004085;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #004085; /* Matches the institutional blue */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #002752;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="kprcas.jpg" alt="kprcas.jpg">
        </div>

        <div class="portal-title">Academic Portal Login</div>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Roll No / Register No / Email</label>
                <input type="text" id="username" name="username" placeholder="Enter your credentials" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="footer-text">
            &copy; 2026 KPR Institute of Engineering and Technology. All Rights Reserved.
        </div>
    </div>

</body>
</html>
